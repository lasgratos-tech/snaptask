<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transaction Confirmation V2</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#16439c",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                        "border-industrial": "#2d3442",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for terminal feel */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #111621;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d3442;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display antialiased selection:bg-primary selection:text-white">
<!-- Header -->
<header class="flex items-center justify-between p-4 border-b-2 border-gray-300 dark:border-border-industrial bg-white dark:bg-background-dark sticky top-0 z-10">
<button class="text-gray-900 dark:text-white flex items-center justify-center w-10 h-10 hover:bg-gray-100 dark:hover:bg-white/5 rounded transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h2 class="text-gray-900 dark:text-white text-sm font-bold tracking-widest uppercase">TRX-CONF-V2</h2>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col p-4 max-w-md mx-auto w-full">
<!-- Terminal Title -->
<div class="mt-4 mb-6">
<h3 class="text-primary tracking-tight text-lg font-bold leading-tight text-left font-mono">// TERMINAL_PAYMENT_V2</h3>
</div>
<!-- Status Pill -->
<div class="mb-8">
<div class="inline-flex h-8 items-center gap-x-2 rounded border-2 border-gray-300 dark:border-border-industrial bg-gray-100 dark:bg-[#1a202e] pl-3 pr-4">
<div class="w-2 h-2 rounded-full bg-gray-500 dark:bg-gray-400 animate-pulse"></div>
<p class="text-gray-600 dark:text-gray-300 text-xs font-bold font-mono leading-normal tracking-wide">STATUS: AWAITING_FUNDS</p>
</div>
</div>
<!-- Receipt Grid -->
<div class="w-full border-2 border-gray-300 dark:border-border-industrial rounded bg-white dark:bg-[#161b26] mb-8 shadow-sm">
<!-- Row 1 -->
<div class="flex justify-between items-center p-4 border-b-2 border-gray-300 dark:border-border-industrial">
<p class="text-gray-500 dark:text-gray-400 text-xs font-bold uppercase tracking-wider">TASK_ID: #8842-X</p>
<p class="text-gray-900 dark:text-white text-sm font-medium font-mono">20.00</p>
</div>
<!-- Row 2 -->
<div class="flex justify-between items-center p-4 border-b-2 border-gray-300 dark:border-border-industrial">
<p class="text-gray-500 dark:text-gray-400 text-xs font-bold uppercase tracking-wider">Processing_Fee</p>
<p class="text-gray-900 dark:text-white text-sm font-medium font-mono">0.83</p>
</div>
<!-- Row 3 -->
<div class="flex justify-between items-center p-4">
<p class="text-gray-500 dark:text-gray-400 text-xs font-bold uppercase tracking-wider">VAT (20%)</p>
<p class="text-gray-900 dark:text-white text-sm font-medium font-mono">4.17</p>
</div>
</div>
<!-- Hero Total -->
<div class="flex flex-col items-center justify-center my-4 py-6 border-y-2 border-dotted border-gray-300 dark:border-gray-700/30">
<p class="text-gray-500 dark:text-gray-500 text-[10px] font-bold tracking-[0.2em] uppercase mb-2">Total Debit Authorization</p>
<h1 class="text-gray-900 dark:text-white text-5xl font-bold leading-none tracking-tight flex items-baseline gap-2">
                25.00 <span class="text-2xl text-gray-400 dark:text-gray-600 font-medium">EUR</span>
</h1>
</div>
<!-- Spacer to push button down -->
<div class="flex-1"></div>
<!-- Action Button -->
<div class="mt-8">
<button class="group w-full relative flex items-center justify-center gap-3 bg-primary hover:bg-[#123680] active:translate-y-[1px] text-white font-bold py-5 px-6 rounded shadow-lg transition-all duration-75 ease-out overflow-hidden border-b-4 border-[#0f2d6b]">
<!-- Technical scan line effect overlay -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent via-white/5 to-transparent opacity-0 group-hover:opacity-100 translate-y-[-100%] group-hover:translate-y-[100%] transition-transform duration-700 ease-in-out"></div>
<span class="material-symbols-outlined text-[20px]">terminal</span>
<span class="tracking-widest text-sm">PAY AND LAUNCH EXECUTION</span>
</button>
<!-- Legal Footer -->
<div class="mt-4 text-center opacity-60">
<p class="text-[10px] text-gray-500 dark:text-gray-400 font-mono uppercase tracking-wide">
                    // Irrevocable execution command.
                </p>
</div>
</div>
</main>
</body></html>
