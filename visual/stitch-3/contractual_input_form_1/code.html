<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SnapTask - Contractual Input Form</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#1c2230",
                        "border-dark": "#2d3545",
                        "text-dim": "#8b94a5",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "mono": ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "Liberation Mono", "Courier New", "monospace"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "sm": "0.125rem",
                        "md": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for a more industrial look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #101622;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d3545;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #135bec;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white overflow-hidden h-screen flex flex-col">
<!-- Header Block -->
<header class="flex-none bg-background-light dark:bg-background-dark border-b border-gray-200 dark:border-border-dark pt-safe-top">
<div class="flex items-center px-4 py-3 justify-between">
<button class="text-slate-600 dark:text-white flex size-10 shrink-0 items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 rounded-md transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h2 class="text-slate-900 dark:text-white text-base font-bold uppercase tracking-wide">Contract #8X-92</h2>
<div class="flex items-center gap-2 mt-0.5">
<div class="size-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
<span class="text-[10px] font-mono text-text-dim uppercase tracking-wider">Active // Awaiting Input</span>
</div>
</div>
<button class="text-slate-600 dark:text-white flex size-10 shrink-0 items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 rounded-md transition-colors">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</div>
<!-- Metadata Grid -->
<div class="grid grid-cols-2 border-t border-gray-200 dark:border-border-dark divide-x divide-gray-200 dark:divide-border-dark">
<div class="px-4 py-2 bg-gray-50 dark:bg-surface-dark/50">
<p class="text-text-dim text-[10px] font-bold uppercase tracking-wider mb-0.5">Hash</p>
<p class="text-slate-900 dark:text-white text-xs font-mono truncate">0x4A7...B2F</p>
</div>
<div class="px-4 py-2 bg-gray-50 dark:bg-surface-dark/50">
<p class="text-text-dim text-[10px] font-bold uppercase tracking-wider mb-0.5">Type</p>
<p class="text-slate-900 dark:text-white text-xs font-mono uppercase">Auto_Exec</p>
</div>
</div>
</header>
<!-- Scrollable Content Area -->
<main class="flex-1 overflow-y-auto p-4 space-y-6">
<!-- Input Section: String -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-baseline mb-1">
<label class="text-slate-600 dark:text-text-dim text-xs font-bold uppercase tracking-wider">Input_01 (String)</label>
<span class="text-xs font-mono text-primary">[MAX 256 CHARS]</span>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-dim text-lg">edit_note</span>
</div>
<input class="block w-full rounded-md border-gray-300 dark:border-border-dark bg-white dark:bg-surface-dark text-slate-900 dark:text-white pl-10 pr-3 py-3 shadow-sm focus:border-primary focus:ring-1 focus:ring-primary sm:text-sm font-mono placeholder:text-text-dim/50" placeholder="[ Enter string value ]" type="text"/>
</div>
</div>
<!-- Input Section: Enum -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-baseline mb-1">
<label class="text-slate-600 dark:text-text-dim text-xs font-bold uppercase tracking-wider">Input_02 (Enum)</label>
<span class="text-xs font-mono text-primary">[REQUIRED]</span>
</div>
<div class="grid grid-cols-2 gap-2 p-1 bg-gray-200 dark:bg-surface-dark rounded-md border border-gray-300 dark:border-border-dark">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="enum_select" type="radio"/>
<div class="flex items-center justify-center py-2.5 px-3 rounded text-sm font-medium transition-all text-text-dim hover:text-slate-900 dark:hover:text-white peer-checked:bg-white dark:peer-checked:bg-background-dark peer-checked:text-primary dark:peer-checked:text-primary peer-checked:shadow-sm">
<span class="truncate uppercase tracking-tight">Option_A</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="enum_select" type="radio"/>
<div class="flex items-center justify-center py-2.5 px-3 rounded text-sm font-medium transition-all text-text-dim hover:text-slate-900 dark:hover:text-white peer-checked:bg-white dark:peer-checked:bg-background-dark peer-checked:text-primary dark:peer-checked:text-primary peer-checked:shadow-sm">
<span class="truncate uppercase tracking-tight">Option_B</span>
</div>
</label>
</div>
</div>
<!-- Input Section: File Upload -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-baseline mb-1">
<label class="text-slate-600 dark:text-text-dim text-xs font-bold uppercase tracking-wider">Attachment_01 (Blob)</label>
<span class="text-xs font-mono text-primary">[PDF ONLY]</span>
</div>
<label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 dark:border-border-dark rounded-md cursor-pointer bg-gray-50 dark:bg-surface-dark/30 hover:bg-gray-100 dark:hover:bg-surface-dark transition-colors group">
<div class="flex flex-col items-center justify-center pt-5 pb-6">
<span class="material-symbols-outlined text-3xl text-text-dim mb-2 group-hover:text-primary transition-colors">upload_file</span>
<p class="mb-1 text-sm text-text-dim font-mono uppercase"><span class="font-bold text-slate-700 dark:text-white">Click to upload</span> or drag</p>
<p class="text-xs text-text-dim font-mono">MAX 5MB</p>
</div>
<input class="hidden" type="file"/>
</label>
</div>
<!-- Ledger / Cost Breakdown -->
<div class="mt-8 border-t border-gray-200 dark:border-border-dark pt-6">
<h3 class="text-slate-900 dark:text-white text-sm font-bold uppercase tracking-wider mb-4">Transaction Ledger</h3>
<div class="space-y-3 font-mono text-sm">
<div class="flex justify-between items-center text-slate-600 dark:text-text-dim">
<span>Base Cost</span>
<span>0.05 ETH</span>
</div>
<div class="flex justify-between items-center text-slate-600 dark:text-text-dim">
<span>Gas Limit</span>
<span>21000</span>
</div>
<div class="flex justify-between items-center text-slate-600 dark:text-text-dim">
<span>Service Fee (1%)</span>
<span>0.0005 ETH</span>
</div>
<div class="h-px bg-gray-200 dark:bg-border-dark my-2"></div>
<div class="flex justify-between items-center text-slate-900 dark:text-white font-bold">
<span>TOTAL ESTIMATED</span>
<span class="text-primary">0.0505 ETH</span>
</div>
</div>
</div>
</main>
<!-- Footer Action -->
<footer class="flex-none bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-border-dark p-4 pb-safe-bottom">
<button class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-4 px-4 rounded-md shadow-lg shadow-primary/20 active:translate-y-0.5 transition-all flex items-center justify-between group">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-xl">fingerprint</span>
<span class="tracking-wide uppercase text-sm">Pay and Execute</span>
</span>
<span class="font-mono text-sm bg-white/10 px-2 py-1 rounded text-white/90 group-hover:bg-white/20 transition-colors">0.0505 ETH</span>
</button>
</footer>
<style>
        /* Safe area padding for notched devices if viewed in webview */
        .pt-safe-top {
            padding-top: env(safe-area-inset-top);
        }
        .pb-safe-bottom {
            padding-bottom: calc(1rem + env(safe-area-inset-bottom));
        }
    </style>
</body></html>
